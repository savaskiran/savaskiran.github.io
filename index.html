<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>savas@cachyos ~ </title>
<meta name="description" content="savaskiran — bir terminal, bir site.">
<style>
  :root{
    --bg:#0a0d0e;
    --fg:#b9c6c4;
    --accent:#5cf08a;
    --dim:#4a5a58;
    --warn:#f0c05c;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);
    color:var(--fg);
    font:400 clamp(12px,1.6vw,15px)/1.6 "JetBrains Mono","Fira Code",ui-monospace,Menlo,Consolas,monospace;
    overflow:hidden;
  }
  #crt{position:fixed;inset:0;padding:clamp(12px,3vw,32px);overflow-y:auto;cursor:text}
  #crt::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:5;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);
    mix-blend-mode:multiply;
  }
  #glow{position:fixed;inset:0;pointer-events:none;z-index:4;
    background:radial-gradient(ellipse at 50% 40%,transparent 55%,rgba(0,0,0,.55) 100%);}
  #out{white-space:pre-wrap;word-break:break-word}
  .a{color:var(--accent);text-shadow:0 0 8px color-mix(in srgb,var(--accent) 45%,transparent)}
  .d{color:var(--dim)}
  .w{color:var(--warn)}
  .b{font-weight:700}
  #line{display:flex;align-items:baseline;gap:.5ch;margin-top:.2em}
  #cmd{
    flex:1;background:none;border:0;outline:0;color:var(--fg);
    font:inherit;caret-color:var(--accent);min-width:2ch;
  }
  #cur{width:.6ch;height:1.05em;background:var(--accent);display:inline-block;
       animation:bl 1.05s step-end infinite;translate:0 .15em}
  @keyframes bl{50%{opacity:0}}
  #mx{position:fixed;inset:0;z-index:9;display:none;background:#000}
  a{color:var(--accent)}
  ::selection{background:var(--accent);color:#000}
  ::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--dim)}
</style>
</head>
<body>
<div id="crt">
  <div id="out"></div>
  <div id="line" hidden>
    <span><span class="a b">savas@cachyos</span><span class="d">:</span><span class="w">~</span><span class="d">$</span></span>
    <input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="komut">
  </div>
</div>
<div id="glow"></div>
<canvas id="mx"></canvas>

<script>
const out=document.getElementById('out'),line=document.getElementById('line'),
      cmd=document.getElementById('cmd'),crt=document.getElementById('crt');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const scroll=()=>crt.scrollTop=crt.scrollHeight;

function print(text="",cls=""){
  const el=document.createElement('div');
  if(cls)el.className=cls;
  el.textContent=text;
  out.appendChild(el);scroll();return el;
}
async function type(text,cls="",speed=14){
  const el=print("",cls);
  for(const ch of text){el.textContent+=ch;await sleep(speed);}
  return el;
}

/* ---------- içerik ---------- */
const LOGO=[
"      /\\        ",
"     /  \\       ",
"    /\\   \\      ",
"   /      \\     ",
"  /   ,,   \\    ",
" /   |  |  -\\   ",
"/_-''    ''-_\\  "];
const INFO=[
"savas@cachyos",
"-------------",
"OS      CachyOS x86_64",
"Shell   fish",
"Host    github.io",
"Uptime  "+(new Date().getFullYear()-2024)+" yıl civarı",
"Motto   'çalışıyorsa dokunma' — dokunur"];

const FILES={
"about.txt":"Merhaba. Ben Savaş.\nKod yazarım, bozarım, sonra tekrar yazarım.\nBu sayfa bir yapay zekanın bir cuma akşamı bıraktığı hediyedir.",
"contact.md":"github  : github.com/savaskiran\nmail    : bulursun\nkonum   : /home/savas",
".secret":"Tebrikler, gizli dosyayı buldun. Ödülün: bir tavsiye.\nHer şeyi otomatize etmeye çalışma, bazı şeyler elle daha hızlı."
};

const CMDS={
  help(){print(`kullanılabilir komutlar:

  about      ben kimim
  projects   ne yaptım
  skills     ne biliyorum
  contact    nasıl ulaşırsın
  neofetch   zorunlu ritüel
  ls         dosyaları listele
  cat <dosya>  dosya oku
  theme      renk değiştir
  date       tarih
  clear      temizle

  ...ve keşfetmen için birkaç tane daha.`);},

  about(){print(FILES["about.txt"]);},

  projects(){print(`  [01] bu site            — kendi kendini açıklıyor
  [02] dotfiles          — 3 yıllık birikim, 2 dakikada kurulum
  [03] gizli proje       — daha README'si bile yok
  [04] terk edilmiş 12 repo — hepsi anıdır`);},

  skills(){
    const s=[["javascript",92],["linux",88],["git",85],["css",74],["sabır",41]];
    s.forEach(([n,v])=>{
      const f=Math.round(v/5), bar="█".repeat(f)+"░".repeat(20-f);
      print(n.padEnd(12)+bar+" "+v+"%","a");
    });
  },

  contact(){print(FILES["contact.md"]);},

  neofetch(){
    LOGO.forEach((l,i)=>{
      const el=print();
      const a=document.createElement('span');a.className="a b";a.textContent=l;
      const b=document.createElement('span');b.textContent=INFO[i]||"";
      el.append(a,b);
    });
  },

  ls(){print("about.txt   contact.md   projects/   .secret","a");},

  cat(arg){
    if(!arg)return print("cat: hangi dosya?","w");
    FILES[arg]?print(FILES[arg]):print("cat: "+arg+": böyle bir dosya yok","w");
  },

  theme(){
    const t=["#5cf08a","#f0b45c","#5cd4f0","#f05c9e","#c98cf0"];
    const cur=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    const next=t[(t.indexOf(cur)+1)%t.length];
    document.documentElement.style.setProperty('--accent',next);
    print("tema: "+next,"a");
  },

  date(){print(new Date().toLocaleString('tr-TR'));},
  echo(a){print(a||"");},
  clear(){out.innerHTML="";},

  sudo(){print("savas sudoers dosyasında değil. Bu olay rapor edilecektir.","w");},
  fish(){print("🐟 zaten en iyi shell'desin. Devam et.","a");},
  vim(){print("vim açıldı. Çıkmak için... iyi şanslar.","w");},
  exit(){print("terminalden çıkamazsın. terminal sensin.","d");},
  coffee(){print("☕ demleniyor... hata: kafein rezervi tükendi.","w");},
  whoami(){print("bir ziyaretçi. ama iyi bir tane.","a");},

  matrix(){
    const c=document.getElementById('mx'),x=c.getContext('2d');
    c.style.display="block";c.width=innerWidth;c.height=innerHeight;
    const cols=Math.floor(c.width/14),y=Array(cols).fill(1);
    const acc=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    const id=setInterval(()=>{
      x.fillStyle="rgba(0,0,0,.06)";x.fillRect(0,0,c.width,c.height);
      x.fillStyle=acc;x.font="14px monospace";
      y.forEach((v,i)=>{
        x.fillText(String.fromCharCode(0x30A0+Math.random()*96),i*14,v*14);
        if(v*14>c.height&&Math.random()>.975)y[i]=0;
        y[i]++;
      });
    },45);
    const stop=()=>{clearInterval(id);c.style.display="none";
      removeEventListener('keydown',stop);removeEventListener('click',stop);
      print("bağlantı kesildi. gerçek dünyaya hoş geldin.","d");};
    addEventListener('keydown',stop);addEventListener('click',stop);
    setTimeout(stop,9000);
  }
};

/* ---------- döngü ---------- */
const hist=[];let hp=0;

function run(raw){
  const input=raw.trim();
  const el=print();
  const p=document.createElement('span');p.className="a b";p.textContent="savas@cachyos";
  const rest=document.createElement('span');rest.textContent=":~$ "+input;
  el.append(p,rest);
  if(!input)return;
  hist.push(input);hp=hist.length;
  const [name,...args]=input.split(/\s+/);
  const fn=CMDS[name.toLowerCase()];
  fn?fn(args.join(" ")):print(name+": komut bulunamadı. 'help' dene.","w");
}

cmd.addEventListener('keydown',e=>{
  if(e.key==="Enter"){run(cmd.value);cmd.value="";scroll();}
  else if(e.key==="ArrowUp"){if(hp>0)cmd.value=hist[--hp];e.preventDefault();}
  else if(e.key==="ArrowDown"){hp<hist.length-1?cmd.value=hist[++hp]:(hp=hist.length,cmd.value="");}
  else if(e.key==="l"&&e.ctrlKey){e.preventDefault();out.innerHTML="";}
});
crt.addEventListener('click',()=>{if(!getSelection().toString())cmd.focus();});

(async()=>{
  await type("[    0.000000] savaskiran.github.io başlatılıyor...","d",8);
  await sleep(180);
  await type("[    0.412331] kernel: linux-cachyos yüklendi","d",4);
  await type("[    0.883210] fish shell hazır","d",4);
  await type("[    1.204551] ego modülü yüklenemedi (kritik değil)","d",4);
  await sleep(250);
  print();
  CMDS.neofetch();
  print();
  await type("bir terminaldesin. 'help' yazıp entere bas.","a",22);
  print();
  line.hidden=false;cmd.focus();scroll();
})();
</script>
</body>
</html>
