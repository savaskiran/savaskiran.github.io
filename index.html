<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Davinci Sunucu Kontrol Merkezi</title>
    <style>
        body { 
            background-color: #0b0c10; color: #66fcf1; 
            font-family: 'Courier New', monospace; margin: 0; padding: 20px; 
        }
        h1 { 
            text-align: center; border-bottom: 2px dashed #45a29e; 
            padding-bottom: 15px; letter-spacing: 2px; 
        }
        .grid-container { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 20px; margin-top: 20px; 
        }
        .card { 
            background: #1f2833; padding: 20px; border-radius: 5px; 
            box-shadow: 0 0 15px rgba(102, 252, 241, 0.1); border: 1px solid #45a29e;
        }
        .card h3 { margin-top: 0; color: #c5c6c7; }
        .data-value { font-size: 3em; font-weight: bold; margin: 10px 0; }
        .bar-bg { background: #0b0c10; height: 15px; border-radius: 10px; overflow: hidden; }
        .bar-fill { background: #45a29e; height: 100%; width: 0%; transition: width 0.3s ease; }
        
        .log-box { 
            height: 180px; overflow-y: hidden; background: #000; 
            padding: 10px; border-radius: 5px; font-size: 0.9em; 
            border: 1px solid #333; color: #00ff00;
        }
        ul { list-style-type: square; padding-left: 20px; color: #c5c6c7; }
        li { margin-bottom: 8px; }
        .status-ok { color: #00ff00; font-weight: bold; }
    </style>
</head>
<body>

    <h1>[ DAVINCI IOT TELEMETRİ AĞI ]</h1>
    
    <div class="grid-container">
        <!-- Sensör 1 -->
        <div class="card">
            <h3>🌡️ Çekirdek Sıcaklığı</h3>
            <div class="data-value" id="temp-val">45.0 °C</div>
            <div class="bar-bg"><div class="bar-fill" id="temp-bar"></div></div>
        </div>

        <!-- Sensör 2 -->
        <div class="card">
            <h3>⚡ İşlemci Yükü</h3>
            <div class="data-value" id="cpu-val" style="color: #ff9999;">12%</div>
            <div class="bar-bg"><div class="bar-fill" id="cpu-bar" style="background: #ff9999;"></div></div>
        </div>

        <!-- Konteyner Listesi -->
        <div class="card">
            <h3>📦 Aktif Docker Servisleri</h3>
            <ul>
                <li><span class="status-ok">[OK]</span> home-assistant_v2</li>
                <li><span class="status-ok">[OK]</span> mosquitto_mqtt_broker</li>
                <li><span class="status-ok">[OK]</span> containerd_engine</li>
                <li><span class="status-ok">[OK]</span> alpine_firewall_nftables</li>
            </ul>
        </div>

        <!-- Sistem Logları -->
        <div class="card">
            <h3>📡 Canlı Veri Akışı</h3>
            <div class="log-box" id="logs"></div>
        </div>
    </div>

    <script>
        // Sayfadaki elemanları seçme
        const tempVal = document.getElementById('temp-val');
        const tempBar = document.getElementById('temp-bar');
        const cpuVal = document.getElementById('cpu-val');
        const cpuBar = document.getElementById('cpu-bar');
        const logsBox = document.getElementById('logs');
        
        // Sahte log mesajları havuzu
        const fakeLogs = [
            "I2C veriyolu tarandı: Yeni cihaz (0x27) bulundu.",
            "MQTT Broker: 'salon/sicaklik' mesajı alındı.",
            "Firewall kuralı: Port 8123 üzerinden bağlantı kabul edildi.",
            "Docker Daemon: Tüm konteynerler sağlıklı rapor veriyor.",
            "Sistem saati senkronize edildi (NTP pool.ntp.org).",
            "Uyarı: Bellek kullanımı optimum seviyede.",
            "Sensör verisi işleniyor..."
        ];

        // Ekrana yeni log ekleyen fonksiyon
        function addLog() {
            const time = new Date().toLocaleTimeString();
            const msg = fakeLogs[Math.floor(Math.random() * fakeLogs.length)];
            const newLine = document.createElement('div');
            newLine.innerHTML = `> [${time}] ${msg}`;
            
            logsBox.appendChild(newLine);
            
            // Log kutusu dolmasın diye en eski yazıyı sil
            if (logsBox.children.length > 8) {
                logsBox.removeChild(logsBox.firstChild);
            }
        }

        // Her 1.5 saniyede bir verileri güncelle
        setInterval(() => {
            // Matematiksel formüllerle rastgele gerçekçi sıcaklık ve yük üret
            let temp = (40 + Math.random() * 15).toFixed(1);
            let cpu = Math.floor(10 + Math.random() * 70);
            
            // Ekrana yazdır ve grafik çubuklarını doldur
            tempVal.innerText = temp + " °C";
            tempBar.style.width = temp + "%";
            
            cpuVal.innerText = cpu + "%";
            cpuBar.style.width = cpu + "%";
            
            // Bazen log ekle, bazen bekle (gerçekçilik katsın diye)
            if (Math.random() > 0.4) addLog();
            
        }, 1500);

        addLog(); // Sayfa açılır açılmaz ilk logu at
    </script>
</body>
</html>
